name: update-codex-usage

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-limits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh token and fetch usage
        id: update
        continue-on-error: true
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          CLIENT_ID: app_EMoamEEZ73f0CkXaXp7hrann
        run: node scripts/update.mjs

      - name: Commit usage and rotated token
        if: always()
        run: |
          git config user.name "codex-limits-bot"
          git config user.email "codex-limits-bot@users.noreply.github.com"
          git add token.enc usage.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "update codex usage"
          for attempt in 1 2 3; do
            git pull --rebase origin main || true
            if git push; then
              echo "pushed"
              exit 0
            fi
            sleep 5
          done
          echo "push failed"
          exit 1
